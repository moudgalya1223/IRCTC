<header
  class="flex items-center justify-between px-6 py-3 shadow-sm transition-colors sm:px-12"
  [class.bg-white]="!isDarkMode()"
  [class.bg-slate-950]="isDarkMode()"
>
  <div class="flex items-center gap-3">
    <img
      src="/assets/logo_irctc.webp"
      alt="IRCTC logo"
      class="h-16 w-auto object-contain"
    />
    <img
      src="/assets/secondry-logo_irctc.webp"
      alt="Indian Railways logo"
      class="h-14 w-14 rounded-full object-contain"
    />
  </div>

  <nav class="hidden items-center gap-2 md:flex" aria-label="Main navigation">
    @for (link of links(); track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="bg-blue-600 text-white"
        class="rounded-lg px-4 py-2 text-sm font-semibold transition-colors hover:bg-blue-100"
        [class.text-blue-900]="!isDarkMode()"
        [class.text-slate-100]="isDarkMode()"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <app-theme-toggle />
</header>
