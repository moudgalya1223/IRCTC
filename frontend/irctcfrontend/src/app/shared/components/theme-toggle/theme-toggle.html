<button
  type="button"
  [attr.aria-pressed]="isDarkMode()"
  [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  class="flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-semibold transition-colors"
  [class.border-slate-300]="!isDarkMode()"
  [class.text-slate-700]="!isDarkMode()"
  [class.border-slate-600]="isDarkMode()"
  [class.text-slate-200]="isDarkMode()"
  (click)="toggle()"
>
  @if (isDarkMode()) {
    <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41" />
    </svg>
  } @else {
    <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
    </svg>
  }
  {{ isDarkMode() ? 'Light mode' : 'Dark mode' }}
</button>
