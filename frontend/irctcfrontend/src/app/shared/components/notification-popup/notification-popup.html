<div
  class="fixed right-4 top-4 z-[60] flex w-[min(24rem,calc(100vw-2rem))] items-start gap-3 rounded-xl border p-4 shadow-xl"
  [class.border-emerald-200]="variant() === 'success'"
  [class.bg-emerald-50]="variant() === 'success'"
  [class.text-emerald-950]="variant() === 'success'"
  [class.border-red-200]="variant() === 'error'"
  [class.bg-red-50]="variant() === 'error'"
  [class.text-red-950]="variant() === 'error'"
  role="alert"
>
  @if (variant() === 'success') {
    <svg
      aria-hidden="true"
      class="mt-0.5 h-5 w-5 shrink-0 text-emerald-600"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path d="m5 12 4 4L19 6" />
    </svg>
  } @else {
    <svg
      aria-hidden="true"
      class="mt-0.5 h-5 w-5 shrink-0 text-red-600"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path d="M12 9v4m0 4h.01M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z" />
    </svg>
  }

  <p class="flex-1 text-sm font-semibold">{{ message() }}</p>
  <button
    type="button"
    aria-label="Close notification"
    class="text-xl leading-none opacity-60 hover:opacity-100"
    (click)="close()"
  >
    &times;
  </button>
</div>
