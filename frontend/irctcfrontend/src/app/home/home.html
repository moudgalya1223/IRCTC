<main
  class="min-h-screen transition-colors"
  [class.bg-slate-100/60]="!isDarkMode()"
  [class.bg-slate-950/60]="isDarkMode()"
>
  <section class="mx-auto max-w-7xl px-6 py-10 lg:px-12">
    <div class="max-w-3xl">
      <p class="text-xs font-bold uppercase tracking-widest text-blue-600">
        Indian Railway Catering and Tourism Corporation
      </p>
      <h1
        class="my-4 text-4xl font-bold sm:text-6xl"
        [class.text-blue-950]="!isDarkMode()"
        [class.text-white]="isDarkMode()"
      >
        Book your next journey with IRCTC
      </h1>
      <p
        class="max-w-xl text-lg"
        [class.text-slate-600]="!isDarkMode()"
        [class.text-slate-300]="isDarkMode()"
      >
        Search trains, check availability, and plan your travel from one place.
      </p>
      <button
        type="button"
        routerLink="/train-search"
        class="mt-6 flex items-center gap-2 rounded-lg bg-blue-600 px-6 py-3 font-bold text-white transition-colors hover:bg-blue-700"
      >
        <svg
          aria-hidden="true"
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M5 17h14M7 17V6h10v11M5 17a2 2 0 1 0 4 0m6 0a2 2 0 1 0 4 0M7 10h10M9 6V4h6v2" />
        </svg>
        Search trains
      </button>
    </div>

  </section>

</main>
